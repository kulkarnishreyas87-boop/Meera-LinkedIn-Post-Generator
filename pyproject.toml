[project]
name = "skinstinct-drafts"
version = "0.1.0"
description = "Drafts-only LinkedIn assistant for Meera Pillai (Skinstinct). Never posts to LinkedIn."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "python-dotenv>=1.0",
    "python-telegram-bot>=21.0",
    "google-genai>=1.0",
    "apscheduler>=3.10,<4",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "tenacity>=8.2",
    "tzdata>=2024.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
skinstinct = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
